<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCA Projection Demo</title>

  <link rel="stylesheet" href="../assets/css/pca-projection.css">
  <script src="../assets/js/google-tag.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="top-bar" aria-label="PCA controls">
      <div class="title-block">
        <p><a href="../index.html">index</a></p>
        <h1>PCA Projection Demo</h1>
        <p>2Dデータを1D軸へ射影し、分散が最大になる方向を観察できます。</p>
      </div>

      <section class="controls" aria-label="Controls">
        <button id="randomizeButton" type="button">RANDOMIZE</button>
        <button id="optimizeButton" type="button">OPTIMIZE</button>
        <label class="angle-control">
          <span>ANGLE <strong id="angleReadout">0°</strong></span>
          <input id="angleSlider" type="range" min="0" max="180" step="0.1" value="24">
        </label>
      </section>
    </header>

    <section class="visualization" aria-label="Interactive PCA visualization">
      <canvas id="plotCanvas" aria-label="Scatter plot with projection axis"></canvas>
      <div id="varianceReadout" class="variance-readout" aria-live="polite">VAR: 0.00</div>
    </section>
  </main>

  <script src="../assets/js/pca-projection.js"></script>
</body>
</html>
